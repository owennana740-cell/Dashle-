services:
  - type: web
    name: dashle
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 60 --bind 0.0.0.0:$PORT web:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashle-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_EMAILS
        value: owennana39@gmail.com,owennana740@gmail.com
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_CURRENCY
        value: XOF
      - key: PAYDUNYA_MODE
        value: test
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      - key: PAYDUNYA_STORE_NAME
        value: Dashle
      - key: PAYDUNYA_CURRENCY
        value: XOF
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: XOF
      - key: OPENWEATHER_API_KEY
        sync: false
  - type: cron
    name: dashle-scheduled-tasks
    runtime: python
    schedule: '*/5 * * * *'
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_runner.py
    envVars:
      - key: DASHLE_CRON_URL
        value: https://dashle.onrender.com/internal/cron/run
      - key: CRON_SECRET
        fromService:
          type: web
          name: dashle
          envVarKey: CRON_SECRET
databases:
  - name: dashle-db
    databaseName: dashle
    user: dashle
