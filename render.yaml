services:
  - type: web
    name: dashle
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT web:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashle-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
databases:
  - name: dashle-db
    databaseName: dashle
    user: dashle
