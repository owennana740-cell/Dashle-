name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Build release APK
        env:
          DASHLE_RELEASE_STORE_FILE: ${{ secrets.DASHLE_RELEASE_STORE_FILE }}
          DASHLE_RELEASE_STORE_PASSWORD: ${{ secrets.DASHLE_RELEASE_STORE_PASSWORD }}
          DASHLE_RELEASE_KEY_ALIAS: ${{ secrets.DASHLE_RELEASE_KEY_ALIAS }}
          DASHLE_RELEASE_KEY_PASSWORD: ${{ secrets.DASHLE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Build release bundle
        env:
          DASHLE_RELEASE_STORE_FILE: ${{ secrets.DASHLE_RELEASE_STORE_FILE }}
          DASHLE_RELEASE_STORE_PASSWORD: ${{ secrets.DASHLE_RELEASE_STORE_PASSWORD }}
          DASHLE_RELEASE_KEY_ALIAS: ${{ secrets.DASHLE_RELEASE_KEY_ALIAS }}
          DASHLE_RELEASE_KEY_PASSWORD: ${{ secrets.DASHLE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Verify release outputs and reject secrets
        shell: bash
        run: |
          set -euo pipefail

          required_outputs=(
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          )
          for artifact in "${required_outputs[@]}"; do
            if [ ! -s "$artifact" ]; then
              echo "Missing or empty Android artifact: $artifact"
              find app/build/outputs -maxdepth 4 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
              exit 1
            fi
          done

          echo "Scanning tracked source/config files for high-confidence secret patterns..."

          tracked_scan_files="$(
            git ls-files | grep -Ev '^\\.github/workflows/|^android/app/build/|\\.md$' || true
          )"

          provider_patterns=(
            'AIza[0-9A-Za-z_-]{20,}'
            'sk_live_[0-9A-Za-z]{16,}'
            'ghp_[0-9A-Za-z]{20,}'
            'github_pat_[0-9A-Za-z_]{20,}'
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          )

          if [ -n "$tracked_scan_files" ]; then
            for pattern in "${provider_patterns[@]}"; do
              if git grep --cached -I -n -E -- "$pattern" -- $tracked_scan_files; then
                echo "High-confidence provider/private-key secret found in tracked source/configuration"
                exit 1
              fi
            done

            password_literal_pattern='(^|[[:space:]])(password|passwd|secret|token)(_[A-Za-z0-9]+)?[[:space:]]*[:=][[:space:]]*["'\''"][^"'\''$\\x7B\\x7D]{8,}["'\''"]([[:space:]]*(#.*)?)$'
            non_test_scan_files="$(printf '%s\\n' "$tracked_scan_files" | grep -Ev '^tests/' || true)"
            if [ -n "$non_test_scan_files" ] && git grep --cached -I -n -E -- "$password_literal_pattern" -- $non_test_scan_files; then
              echo "Potential plaintext password/secret literal found in tracked non-test source/configuration"
              exit 1
            fi
          fi

          echo "Inspecting generated APK/AAB artifacts separately from tracked source..."

          for artifact in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab; do
            if python3 - "$artifact" <<'PY'
import re
import sys
from pathlib import Path

data = Path(sys.argv[1]).read_bytes()
pem = re.compile(
    rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
    rb"[A-Za-z0-9+/=\\r\\n]{32,}"
    rb"-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
)
raise SystemExit(1 if pem.search(data) else 0)
PY
            then
              echo "PEM private-key material detected in generated artifact: $artifact"
              exit 1
            fi

            for label_and_pattern in \
              'Google API key|AIza[0-9A-Za-z_-]{20,}' \
              'Stripe live key|sk_live_[0-9A-Za-z]{16,}' \
              'GitHub token|ghp_[0-9A-Za-z]{20,}' \
              'GitHub fine-grained token|github_pat_[0-9A-Za-z_]{20,}'; do
              label="${label_and_pattern%%|*}"
              pattern="${label_and_pattern#*|}"
              if strings -a "$artifact" | grep -E -q -- "$pattern"; then
                echo "Observed $label-shaped text in generated binary: $artifact"
              fi
            done
          done

          echo "Secret checks passed: tracked source/configuration is scanned for high-confidence secrets; generated binaries are inspected separately without treating binary strings as source secrets."
      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab >/tmp/aab-signature-check.txt
          grep -q "jar verified" /tmp/aab-signature-check.txt
      - name: Report artifact sizes
        shell: bash
        run: |
          set -euo pipefail
          stat -c '%n %s bytes' \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashle-android-build
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
