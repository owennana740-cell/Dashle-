name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Build release APK
        env:
          DASHLE_RELEASE_STORE_FILE: ${{ secrets.DASHLE_RELEASE_STORE_FILE }}
          DASHLE_RELEASE_STORE_PASSWORD: ${{ secrets.DASHLE_RELEASE_STORE_PASSWORD }}
          DASHLE_RELEASE_KEY_ALIAS: ${{ secrets.DASHLE_RELEASE_KEY_ALIAS }}
          DASHLE_RELEASE_KEY_PASSWORD: ${{ secrets.DASHLE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Build release bundle
        env:
          DASHLE_RELEASE_STORE_FILE: ${{ secrets.DASHLE_RELEASE_STORE_FILE }}
          DASHLE_RELEASE_STORE_PASSWORD: ${{ secrets.DASHLE_RELEASE_STORE_PASSWORD }}
          DASHLE_RELEASE_KEY_ALIAS: ${{ secrets.DASHLE_RELEASE_KEY_ALIAS }}
          DASHLE_RELEASE_KEY_PASSWORD: ${{ secrets.DASHLE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Verify release outputs and reject secrets
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

          echo "Scanning tracked source/config files for high-confidence secret patterns..."
          provider_pattern='AIza[0-9A-Za-z_-]{20,}|sk'"'"'_live_[0-9A-Za-z]+'"'"'|gh'"'"'p_[0-9A-Za-z]{20,}|github_pat_[0-9A-Za-z_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          provider_matches="$(git grep --cached -I -l -E "$provider_pattern" -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude)android/app/build/**' \
            ':(exclude)**/*.md' || true)"
          if [ -n "$provider_matches" ]; then
            echo "High-confidence provider/private-key match in tracked source/config files:"
            printf '%s\n' "$provider_matches"
            exit 1
          fi

          password_pattern='password[[:space:]]*[:=][[:space:]]*["'"'"'][^$"'""{}][^"'"'"']+["'"'"']'
          password_matches="$(git grep --cached -I -l -E "$password_pattern" -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude)android/app/build/**' \
            ':(exclude)tests/**' \
            ':(exclude)**/*.md' || true)"
          if [ -n "$password_matches" ]; then
            echo "Potential plaintext password in tracked non-test source/config files:"
            printf '%s\n' "$password_matches"
            exit 1
          fi

          echo "Inspecting generated APK/AAB artifacts without treating binary strings as source secrets..."
          for artifact in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab; do
            if strings -a "$artifact" | grep -E -q -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
              echo "Private-key material detected in generated artifact: $artifact"
              exit 1
            fi

            # Provider-shaped API/token strings in third-party binaries are inspected but
            # are not treated as proof of a leaked credential by themselves. A real source
            # credential is already blocked by the tracked source/config scan above.
            for label_and_pattern in \
              'Google API key|AIza[0-9A-Za-z_-]{20,}' \
              'Stripe live key|sk'"'"'_live_[0-9A-Za-z]+' \
              'GitHub token|gh'"'"'p_[0-9A-Za-z]{20,}' \
              'GitHub fine-grained token|github_pat_[0-9A-Za-z_]{20,}'; do
              label="${label_and_pattern%%|*}"
              pattern="${label_and_pattern#*|}"
              if strings -a "$artifact" | grep -E -q -- "$pattern"; then
                echo "Observed $label-shaped text in generated binary: $artifact (not treated as a leak unless the same credential exists in tracked source/config)"
              fi
            done
          done

          echo "Secret checks passed: source/config heuristics exclude generated binaries; binary inspection remains active for private keys and reports provider-shaped strings without false-positive failure."
      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab >/tmp/aab-signature-check.txt
          grep -q "jar verified" /tmp/aab-signature-check.txt
      - name: Report artifact sizes
        shell: bash
        run: |
          set -euo pipefail
          stat -c '%n %s bytes' \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashle-android-build
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
