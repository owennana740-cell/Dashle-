name: Python validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compiler Python
        run: python -m py_compile artifact_tools.py web.py app.py
      - name: Tests génération fichiers/images
        run: python -m unittest tests.test_artifact_tools -v
      - name: Vérifier le diff
        run: git diff --check
